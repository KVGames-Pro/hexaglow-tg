<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
    <title>Hexa_Glow_Merge_Sort</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            position: fixed;
            inset: 0;
            background-color: #05020d;
            overflow: hidden;
            touch-action: none !important;
            overscroll-behavior: none !important;
            user-select: none !important;
            -webkit-user-select: none !important;
            -webkit-touch-callout: none !important;
        }
        #canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
            outline: none;
            touch-action: none !important;
        }
        #boot-loader {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at center, #140a33 0%, #05020d 100%);
            color: #00f0ff;
            font-family: sans-serif;
            font-size: 20px;
            letter-spacing: 2px;
            z-index: 9999;
            transition: opacity 0.35s ease;
        }
        #fs-toggle-btn {
            position: fixed;
            top: 10px;
            right: 10px;
            width: 38px;
            height: 38px;
            border-radius: 10px;
            border: 1.5px solid rgba(0, 240, 255, 0.65);
            background: rgba(12, 6, 32, 0.72);
            color: #00f0ff;
            font-size: 18px;
            line-height: 1;
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 9998;
            box-shadow: 0 0 12px rgba(0, 240, 255, 0.25);
            backdrop-filter: blur(4px);
            transition: transform 0.15s ease, background 0.15s ease, opacity 0.2s ease;
            opacity: 0.82;
        }
        #fs-toggle-btn:hover {
            opacity: 1;
            transform: scale(1.08);
            background: rgba(24, 14, 62, 0.92);
        }
        #rotate-overlay {
            position: fixed;
            inset: 0;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at center, #140a33 0%, #05020d 100%);
            color: #00f0ff;
            font-family: sans-serif;
            font-size: 22px;
            font-weight: bold;
            text-align: center;
            padding: 24px;
            z-index: 10000;
        }
        #rotate-btn {
            margin-top: 24px;
            padding: 16px 32px;
            font-size: 18px;
            font-weight: bold;
            color: #05020d;
            background: linear-gradient(90deg, #00f0ff, #00f59b);
            border: none;
            border-radius: 16px;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.5);
            cursor: pointer;
        }
        @media screen and (orientation: portrait) {
            #rotate-overlay {
                display: flex;
            }
        }
    </style>
    <link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

    <script>
        var AD_CONFIG = {
            ADSGRAM_REWARD_ID: "60432",
            ADSGRAM_INTERSTITIAL_ID: "int-60433",
            RSYA_WEB_REWARD_ID: "R-A-XXXXXX-1",
            RSYA_WEB_INT_ID: "R-A-XXXXXX-2"
        };

        var _tgFullscreenRequested = false;
        var _tgOrientationLocked = false;
        var _resizeTimer = null;

        function applyTelegramViewport(isUserGesture) {
            if (window.Telegram && window.Telegram.WebApp) {
                var tg = window.Telegram.WebApp;
                try { tg.ready(); } catch(e) {}
                try { if (!tg.isExpanded) tg.expand(); } catch(e) {}
                try {
                    if (typeof tg.setHeaderColor === "function") tg.setHeaderColor("#05020d");
                    if (typeof tg.setBackgroundColor === "function") tg.setBackgroundColor("#05020d");
                } catch(e) {}
                try {
                    if (typeof tg.disableVerticalSwipes === "function") tg.disableVerticalSwipes();
                } catch(e) {}

                if ((isUserGesture || !_tgFullscreenRequested) && typeof tg.requestFullscreen === "function" && !tg.isFullscreen) {
                    _tgFullscreenRequested = true;
                    try { tg.requestFullscreen(); } catch(e) {}
                }

                if (!_tgOrientationLocked && window.innerWidth > window.innerHeight && typeof tg.lockOrientation === "function") {
                    _tgOrientationLocked = true;
                    try { tg.lockOrientation(); } catch(e) {}
                }
            }

            if (isUserGesture) {
                try {
                    if (screen.orientation && typeof screen.orientation.lock === "function") {
                        screen.orientation.lock("landscape").catch(function(){});
                    }
                } catch(e) {}
            }
        }

        function toggleWebFullscreen() {
            var doc = window.document;
            var docEl = doc.documentElement;
            var isFs = doc.fullscreenElement || doc.webkitFullscreenElement || doc.mozFullScreenElement || doc.msFullscreenElement;

            if (!isFs) {
                var req = docEl.requestFullscreen || docEl.webkitRequestFullscreen || docEl.mozRequestFullScreen || docEl.msRequestFullscreen;
                if (req) {
                    req.call(docEl).catch(function() {
                        if (window.GamePlatform && window.GamePlatform.current === "vk" && typeof vkBridge !== "undefined") {
                            vkBridge.send("VKWebAppResizeWindow", { width: 1280, height: 760 }).catch(function(){});
                        } else if (window.GamePlatform && window.GamePlatform.current === "ok" && typeof FAPI !== "undefined" && FAPI.UI && FAPI.UI.setWindowSize) {
                            FAPI.UI.setWindowSize(1280, 760);
                        }
                    });
                }
                try {
                    if (screen.orientation && typeof screen.orientation.lock === "function") {
                        screen.orientation.lock("landscape").catch(function(){});
                    }
                } catch(e) {}
            } else {
                var exit = doc.exitFullscreen || doc.webkitExitFullscreen || doc.mozCancelFullScreen || doc.msExitFullscreen;
                if (exit) {
                    exit.call(doc).catch(function(){});
                }
            }
        }

        function updateFullscreenButtonIcon() {
            var btn = document.getElementById("fs-toggle-btn");
            if (!btn) return;
            var isFs = document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement;
            btn.textContent = isFs ? "✕" : "⛶";
            btn.title = isFs ? "Выйти из полноэкранного режима" : "На весь экран";
        }

        document.addEventListener("fullscreenchange", updateFullscreenButtonIcon);
        document.addEventListener("webkitfullscreenchange", updateFullscreenButtonIcon);

        applyTelegramViewport(false);

        window.addEventListener("orientationchange", function() {
            _tgOrientationLocked = false;
            clearTimeout(_resizeTimer);
            _resizeTimer = setTimeout(function() { applyTelegramViewport(false); }, 250);
        });

        window.addEventListener("resize", function() {
            clearTimeout(_resizeTimer);
            _resizeTimer = setTimeout(function() {
                if (!_tgOrientationLocked && window.innerWidth > window.innerHeight) {
                    applyTelegramViewport(false);
                }
            }, 300);
        });

        window.GamePlatform = {
            current: "unknown",
            init: function() {
                var search = window.location.search || "";
                var hash = window.location.hash || "";
                var fullUrl = search + "&" + hash;
                var referrer = document.referrer || "";
                var host = window.location.hostname || "";

                var isVKPlay = fullUrl.indexOf("mr_app_id") !== -1 || referrer.indexOf("vkplay.ru") !== -1 || host.indexOf("vkplay.ru") !== -1;
                var isVK = (fullUrl.indexOf("vk_app_id=") !== -1 || fullUrl.indexOf("viewer_id=") !== -1 || fullUrl.indexOf("api_id=") !== -1) && !isVKPlay;
                var isOK = fullUrl.indexOf("application_key=") !== -1 || fullUrl.indexOf("logged_in=") !== -1 || referrer.indexOf("ok.ru") !== -1;
                var isYandex = referrer.indexOf("yandex.ru") !== -1 || referrer.indexOf("yandex.com") !== -1 || fullUrl.indexOf("ysdk") !== -1;
                var isTG = fullUrl.indexOf("tgWebApp") !== -1 || referrer.indexOf("t.me") !== -1 || (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData !== "");

                if (isVKPlay) {
                    this.current = "vk_play";
                    var s = document.createElement('script');
                    s.src = "https://vkplay.ru/iframe/api.js";
                    document.head.appendChild(s);
                } else if (isVK) {
                    this.current = "vk";
                    var s = document.createElement('script');
                    s.src = "https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js";
                    s.onload = function() {
                        if (typeof vkBridge !== "undefined") {
                            vkBridge.send("VKWebAppInit").catch(function(){});
                            var targetW = Math.max(window.innerWidth || 1000, 1000);
                            var targetH = Math.min(Math.round(targetW * 0.5625), 860);
                            vkBridge.send("VKWebAppResizeWindow", { width: targetW, height: targetH }).catch(function(){});
                        }
                    };
                    document.head.appendChild(s);
                } else if (isOK) {
                    this.current = "ok";
                    var s = document.createElement('script');
                    s.src = "https://api.ok.ru/js/fapi5.js";
                    s.onload = function() {
                        if (typeof FAPI !== "undefined") {
                            var rParams = FAPI.Util.getRequestParameters();
                            FAPI.init(rParams["api_server"], rParams["apiconnection"], function() {
                                if (FAPI.UI && FAPI.UI.setWindowSize) {
                                    var targetW = Math.max(window.innerWidth || 1000, 1000);
                                    var targetH = Math.min(Math.round(targetW * 0.5625), 860);
                                    FAPI.UI.setWindowSize(targetW, targetH);
                                }
                                if (FAPI.UI && FAPI.UI.loadAd) FAPI.UI.loadAd();
                            }, function(){});
                        }
                    };
                    document.head.appendChild(s);
                } else if (isYandex) {
                    this.current = "yandex";
                    var s = document.createElement('script');
                    s.src = "https://yandex.ru/games/sdk/v2";
                    s.onload = function() {
                        YaGames.init().then(function(ysdk) {
                            window.ysdk = ysdk;
                            if (ysdk.features && ysdk.features.LoadingAPI) ysdk.features.LoadingAPI.ready();
                        });
                    };
                    document.head.appendChild(s);
                } else if (isTG) {
                    this.current = "telegram";
                    applyTelegramViewport(false);
                    var s2 = document.createElement('script');
                    s2.src = "https://sad.adsgram.ai/js/sad.min.js";
                    document.head.appendChild(s2);
                } else {
                    this.current = "web";
                    this.loadYandexContext();
                }
            },
            loadYandexContext: function() {
                window.yaContextCb = window.yaContextCb || [];
                var ys = document.createElement('script');
                ys.src = "https://yandex.ru/ads/system/context.js";
                ys.async = true;
                document.head.appendChild(ys);
            }
        };
        window.GamePlatform.init();

        var _adInProgress = false;

        function showTgAd(onSuccess, onError) {
            if (_adInProgress) return;
            if (typeof window.Adsgram !== 'undefined') {
                _adInProgress = true;
                window.Adsgram.init({ blockId: AD_CONFIG.ADSGRAM_REWARD_ID }).show()
                    .then(function() { _adInProgress = false; if (onSuccess) onSuccess(); })
                    .catch(function() { _adInProgress = false; if (onError) onError(); });
            } else {
                if (onError) onError();
            }
        }

        function showTgInterstitial(onClosed) {
            if (_adInProgress) { if (onClosed) onClosed(); return; }
            if (typeof window.Adsgram !== 'undefined' && AD_CONFIG.ADSGRAM_INTERSTITIAL_ID) {
                _adInProgress = true;
                window.Adsgram.init({ blockId: AD_CONFIG.ADSGRAM_INTERSTITIAL_ID }).show()
                    .then(function() { _adInProgress = false; if (onClosed) onClosed(); })
                    .catch(function() { _adInProgress = false; if (onClosed) onClosed(); });
            } else {
                if (onClosed) onClosed();
            }
        }

        function showRsyaWebAd(isRewarded, onSuccess, onError) {
            if (window.GamePlatform && window.GamePlatform.current === "vk_play") {
                if (onError) onError();
                return;
            }
            var blockId = isRewarded ? AD_CONFIG.RSYA_WEB_REWARD_ID : AD_CONFIG.RSYA_WEB_INT_ID;
            var isMobileBrowser = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            var rsyaPlatform = isMobileBrowser ? "touch" : "desktop";

            if (window.Ya && window.Ya.Context && window.Ya.Context.AdvManager && blockId && blockId.indexOf("XXXXXX") === -1) {
                window.yaContextCb.push(function() {
                    Ya.Context.AdvManager.render({
                        blockId: blockId,
                        type: isRewarded ? "rewarded" : "fullscreen",
                        platform: rsyaPlatform,
                        onRewarded: function(isRewardedDone) {
                            if (isRewardedDone && onSuccess) onSuccess();
                            else if (onError) onError();
                        },
                        onClose: function() {
                            if (!isRewarded && onSuccess) onSuccess();
                        },
                        onError: function() {
                            if (onError) onError();
                        }
                    });
                });
            } else {
                if (onError) onError();
            }
        }
    </script>
</head>
<body>
    <div id="rotate-overlay">
        <div style="font-size: 48px; margin-bottom: 16px;">📱 ↻</div>
        <div>ПОВЕРНИТЕ ТЕЛЕФОН ГОРИЗОНТАЛЬНО</div>
        <div style="font-size: 16px; color: #a8f9ff; margin-top: 8px; font-weight: normal;">Для полноэкранной игры в альбомном режиме</div>
        <button id="rotate-btn" onclick="applyTelegramViewport(true)">ПОВЕРНУТЬ ЭКРАН</button>
    </div>
    <button id="fs-toggle-btn" title="На весь экран" onclick="toggleWebFullscreen()">⛶</button>
    <div id="boot-loader">HEXA GLOW: ЗАГРУЗКА...</div>
    <canvas id="canvas"></canvas>
    <script src="index.js"></script>
    <script>
        (function() {
            var fsBtn = document.getElementById("fs-toggle-btn");
            if (fsBtn && window.GamePlatform && window.GamePlatform.current !== "telegram") {
                fsBtn.style.display = "flex";
            }
        })();

        document.addEventListener('touchend', function() {
            if (!_tgOrientationLocked || !(window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.isFullscreen)) {
                applyTelegramViewport(true);
            }
        }, { passive: true });

        document.addEventListener('touchmove', function(e) {
            e.preventDefault();
        }, { passive: false });

        try {
            var config = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":34232784,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
            config.ensureCrossOriginIsolationHeaders = false;
            config.emscriptenPoolSize = 0;
            config.godotPoolSize = 0;
            delete window.WebAssembly.instantiateStreaming;
            const engine = new Engine(config);
            engine.startGame().then(function() {
                applyTelegramViewport(false);
                var loader = document.getElementById('boot-loader');
                if (loader) {
                    loader.style.opacity = '0';
                    setTimeout(function() { loader.remove(); }, 400);
                }
            });
        } catch (err) {
            console.error("Engine init error:", err);
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
    <title>Hexa Glow: Merge & Sort</title>
    <style>
        body { margin: 0; padding: 0; background-color: #05020d; overflow: hidden; }
        canvas { width: 100%; height: 100%; display: block; outline: none; }
    </style>
    <link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

    <script>
        window.GamePlatform = {
            current: "unknown",
            init: function() {
                var search = window.location.search || "";
                var referrer = document.referrer || "";

                var isVKPlay = search.indexOf("mr_app_id") !== -1 || referrer.indexOf("vkplay.ru") !== -1;
                var isVK = (search.indexOf("vk_app_id=") !== -1 || search.indexOf("viewer_id=") !== -1 || search.indexOf("api_id=") !== -1) && !isVKPlay;
                var isOK = search.indexOf("application_key=") !== -1 || search.indexOf("logged_in=") !== -1 || referrer.indexOf("ok.ru") !== -1;
                var isYandex = referrer.indexOf("yandex.ru") !== -1 || referrer.indexOf("yandex.com") !== -1 || search.indexOf("ysdk") !== -1;
                var isTG = search.indexOf("tgWebAppVersion") !== -1 || referrer.indexOf("t.me") !== -1;

                if (isVKPlay) {
                    this.current = "vk_play";
                    var s = document.createElement('script');
                    s.src = "https://vkplay.ru/iframe/api.js";
                    document.head.appendChild(s);
                } else if (isVK) {
                    this.current = "vk";
                    var s = document.createElement('script');
                    s.src = "https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js";
                    s.onload = function() {
                        if (typeof vkBridge !== "undefined") vkBridge.send("VKWebAppInit").catch(function(){});
                    };
                    document.head.appendChild(s);
                } else if (isOK) {
                    this.current = "ok";
                    var s = document.createElement('script');
                    s.src = "https://api.ok.ru/js/fapi5.js";
                    s.onload = function() {
                        if (typeof FAPI !== "undefined") {
                            var rParams = FAPI.Util.getRequestParameters();
                            FAPI.init(rParams["api_server"], rParams["apiconnection"], function() {
                                if (FAPI.UI && FAPI.UI.loadAd) FAPI.UI.loadAd();
                            }, function(){});
                        }
                    };
                    document.head.appendChild(s);
                } else if (isYandex) {
                    this.current = "yandex";
                    var s = document.createElement('script');
                    s.src = "https://yandex.ru/games/sdk/v2";
                    s.onload = function() {
                        YaGames.init().then(function(ysdk) {
                            window.ysdk = ysdk;
                            if (ysdk.features && ysdk.features.LoadingAPI) ysdk.features.LoadingAPI.ready();
                        });
                    };
                    document.head.appendChild(s);
                } else if (isTG) {
                    this.current = "telegram";
                    var s1 = document.createElement('script');
                    s1.src = "https://telegram.org/js/telegram-web-app.js";
                    document.head.appendChild(s1);
                    var s2 = document.createElement('script');
                    s2.src = "https://adsgram.ai/js/adsgram.js";
                    document.head.appendChild(s2);
                }
            }
        };
        window.GamePlatform.init();

        function showTgAd(onSuccess, onError) {
            if (typeof window.Adsgram !== 'undefined') {
                window.Adsgram.init({ blockId: "reward-55151" }).show()
                    .then(function(){ if(onSuccess) onSuccess(); })
                    .catch(function(){ if(onError) onError(); });
            } else {
                if(onError) onError();
            }
        }
    </script>
</head>
<body>
    <canvas id="canvas"></canvas>
    <script src="index.js"></script>
    <script>
        try {
            var config = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":34216736,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
            config.ensureCrossOriginIsolationHeaders = false;
            config.emscriptenPoolSize = 0;
            config.godotPoolSize = 0;
            delete window.WebAssembly.instantiateStreaming;
            const engine = new Engine(config);
            engine.startGame();
        } catch (err) {
            console.error("Engine init error:", err);
        }
    </script>
</body>
</html>
